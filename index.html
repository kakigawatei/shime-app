<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="締めアプリ">
<meta name="theme-color" content="#355E52">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>締めアプリ｜柿川亭×アブララボ</title>
<style>
  :root{
    /* ---- theme tokens ---- */
    --primary:#355E52; --primary-d:#2b4d43; --primary-l:#eef3f1;
    --bg:#F7F6F3; --card:#FFFFFF;
    --success:#38A169; --success-bg:#e7f4ec;
    --warning:#F59E0B; --warning-bg:#fdf1dd;
    --error:#E53E3E;
    --info:#3B7DD8; --info-bg:#e9f1fc;
    --border:#E8E8E5; --text:#222222; --sub:#777777;
    --r-card:20px; --r-md:14px; --r-pill:999px; --r-sm:10px;
    --sp:16px; --sp-lg:24px;
    --shadow-card:0 1px 2px rgba(30,30,25,.04), 0 8px 24px rgba(30,30,25,.045);
    --shadow-btn:0 6px 18px rgba(53,94,82,.28);
    --sat:env(safe-area-inset-top,0px); --sab:min(env(safe-area-inset-bottom,0px),34px);
    --fs-h:29px; --fs-sec:22px; --fs-card:20px; --fs-body:15.5px; --fs-status:13px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100dvh; overflow:hidden; overscroll-behavior:none;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    color:var(--text); background:var(--bg); -webkit-font-smoothing:antialiased;}
  #app{height:100dvh; display:flex; flex-direction:column; max-width:540px; margin:0 auto; position:relative; background:var(--bg);}

  /* ---------- header ---------- */
  header{flex-shrink:0; background:linear-gradient(180deg,#3a685b,#30544a); color:#fff;
    padding:calc(var(--sat) + 14px) var(--sp) 16px;}
  .htop{display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:30px;}
  .htitle{font-weight:800; font-size:19px; letter-spacing:.02em;}
  .hname{font-size:12.5px; font-weight:600; background:rgba(255,255,255,.16); padding:6px 12px; border-radius:var(--r-pill); cursor:pointer; white-space:nowrap;}
  .hback{display:flex; align-items:center; gap:6px; font-weight:700; font-size:16px; background:none; border:0; color:#fff; cursor:pointer; padding:4px 0;}
  .stabs{display:flex; gap:10px; margin-top:14px;}
  .stab{flex:1; display:flex; align-items:center; justify-content:center; gap:8px; padding:13px; border-radius:var(--r-md);
    font-weight:700; font-size:15px; cursor:pointer; border:1px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.10); color:rgba(255,255,255,.8); transition:all .2s;}
  .stab svg{width:18px;height:18px;}
  .stab.on{background:#fff; color:var(--primary); border-color:#fff; box-shadow:0 4px 14px rgba(0,0,0,.12);}

  /* ---------- main ---------- */
  main{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:22px var(--sp) calc(100px + var(--sab));}
  .screen{animation:fade .28s ease;}
  .screen.slide{animation:slidein .26s cubic-bezier(.22,.7,.3,1);}
  @keyframes fade{from{opacity:0} to{opacity:1}}
  @keyframes slidein{from{opacity:0; transform:translateX(24px)} to{opacity:1; transform:none}}

  /* ---------- section ---------- */
  .sec{display:flex; align-items:center; gap:12px; margin-bottom:6px;}
  .sec .sicon{width:40px; height:40px; border-radius:12px; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .sec .sicon svg{width:22px; height:22px;}
  .sec h2{font-size:var(--fs-sec); font-weight:800; margin:0; letter-spacing:.01em;}
  .lead{color:var(--sub); font-size:var(--fs-body); line-height:1.65; margin:2px 0 22px;}

  /* ---------- card ---------- */
  .card{background:var(--card); border-radius:var(--r-card); box-shadow:var(--shadow-card); margin-bottom:14px;}
  .card.tap{cursor:pointer; transition:transform .12s ease;}
  .card.tap:active{transform:scale(.985);}
  .suprow{display:flex; align-items:center; gap:14px; padding:16px 16px;}
  .avatar{width:52px; height:52px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:21px; color:#fff;}
  .supmid{flex:1; min-width:0;}
  .supname{font-size:var(--fs-card); font-weight:700; line-height:1.2; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .supcat{color:var(--sub); font-size:13px; margin-top:3px;}
  .supright{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .chev{color:#c3c1bb; display:flex;}
  .chev svg{width:20px; height:20px;}

  /* ---------- pill / badge ---------- */
  .pill{font-size:12px; font-weight:800; padding:4px 10px; border-radius:var(--r-pill); letter-spacing:.02em; line-height:1; white-space:nowrap; transition:background-color .3s, color .3s;}
  .pill.ch-sms{background:var(--info-bg); color:var(--info);}
  .pill.ch-email{background:var(--warning-bg); color:#c07d10;}
  .pill.ch-line{background:var(--success-bg); color:#2a8f4e;}
  .pill.ch-messenger{background:#efe9fb; color:#6a3fd0;}
  .status{font-size:var(--fs-status); font-weight:800; padding:6px 12px; border-radius:var(--r-pill); white-space:nowrap; transition:background-color .3s, color .3s;}
  .st-none{background:#eef0ee; color:#8a877f;}
  .st-input{background:var(--info-bg); color:var(--info);}
  .st-ready{background:var(--warning-bg); color:#c07d10;}
  .st-sent{background:var(--success-bg); color:var(--success);}

  /* ---------- buttons ---------- */
  .btn{display:flex; align-items:center; justify-content:center; gap:9px; width:100%; border:0; cursor:pointer;
    font-weight:800; font-size:16px; border-radius:var(--r-md); padding:15px; transition:transform .12s, box-shadow .2s; text-decoration:none;}
  .btn:active{transform:scale(.98);}
  .btn svg{width:20px; height:20px;}
  .btn.primary{height:58px; background:linear-gradient(180deg,#3d6b5d,#345a4f); color:#fff; box-shadow:var(--shadow-btn);}
  .btn.primary .sub{font-size:11.5px; font-weight:600; opacity:.85; display:block; margin-top:1px;}
  .btn.primary .lbl{display:flex; flex-direction:column; align-items:flex-start; line-height:1.15;}
  .btn.big{position:relative;}
  .btn.big .chevend{position:absolute; right:16px; opacity:.7;}
  .btn.sec{background:#eef0ec; color:var(--text);}
  .btn.ghost{background:transparent; color:var(--sub); box-shadow:none;}
  .btn.ok{background:var(--success); color:#fff;}
  .btn.disabled{background:#edece8; color:#b3b0a8; box-shadow:none; pointer-events:none;}
  .btnrow{display:flex; gap:10px; margin-top:6px;}
  .btnrow .btn{flex:1;}

  /* ---------- segmented ---------- */
  .seg{display:flex; background:#edece7; border-radius:var(--r-md); padding:4px; margin:4px 0 18px;}
  .seg button{flex:1; border:0; background:none; padding:10px; border-radius:10px; font-weight:700; font-size:14px; color:var(--sub); cursor:pointer; transition:all .2s;}
  .seg button.on{background:#fff; color:var(--primary); box-shadow:0 1px 4px rgba(0,0,0,.08);}

  /* ---------- item stepper ---------- */
  .items{margin:4px 0;}
  .irow{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 4px; border-bottom:1px solid var(--border);}
  .irow:last-child{border-bottom:0;}
  .iname{font-size:16px; font-weight:600;}
  .iunit{color:var(--sub); font-size:13px; font-weight:500; margin-left:3px;}
  .isplit{display:block; color:var(--warning); font-size:12.5px; font-weight:700; margin-top:4px; cursor:pointer;}
  .isplitrow{display:none; align-items:center; gap:8px; margin-top:6px; font-size:13px; color:var(--sub);}
  .isplitrow.on{display:flex;}
  .isplitrow input{width:56px; padding:7px; border:1px solid var(--border); border-radius:8px; text-align:center; font-size:15px;}
  .stepper{display:flex; align-items:center; gap:6px;}
  .stepper button{width:38px; height:38px; border-radius:11px; border:1px solid var(--border); background:#fff; font-size:20px; color:var(--primary); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform .1s;}
  .stepper button:active{transform:scale(.9);}
  .stepper .qv{min-width:28px; text-align:center; font-weight:800; font-size:17px;}
  .qv.hot{color:var(--primary);}

  /* ---------- fields ---------- */
  .field{margin-bottom:14px;}
  .field label{font-size:13px; color:var(--sub); font-weight:600; display:block; margin-bottom:6px;}
  .input, textarea.input, select.input{width:100%; padding:14px; border:1px solid var(--border); border-radius:var(--r-md);
    font-size:16px; font-family:inherit; background:#fff; color:var(--text); -webkit-appearance:none;}
  textarea.input{min-height:150px; line-height:1.6; resize:vertical;}
  .cardpad{padding:18px 16px;}
  .lbl-mini{font-size:13px; color:var(--sub); font-weight:600; margin-bottom:8px; display:block;}

  /* ---------- checklist ---------- */
  .check{display:flex; align-items:center; gap:14px; padding:16px; }
  .check + .check{border-top:1px solid var(--border);}
  .cbox{width:26px; height:26px; border-radius:8px; border:2px solid var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .2s; background:#fff;}
  .cbox.on{background:var(--success); border-color:var(--success);}
  .cbox svg{width:16px; height:16px; color:#fff; opacity:0; transition:opacity .2s;}
  .cbox.on svg{opacity:1;}
  .check .ctxt{flex:1; font-size:16px;}
  .check.done .ctxt{color:var(--sub); text-decoration:line-through;}
  .check .cwho{font-size:11.5px; color:var(--sub);}

  /* ---------- steps (dashboard) ---------- */
  .steprow{display:flex; align-items:center; justify-content:space-between; padding:16px;}
  .steprow + .steprow{border-top:1px solid var(--border);}
  .steprow.soon{opacity:.45;}
  .steprow .stl{font-size:16px; font-weight:600; display:flex; align-items:center; gap:10px;}
  .stnum{width:26px;height:26px;border-radius:8px;background:var(--primary-l);color:var(--primary);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;}

  /* ---------- tabbar ---------- */
  nav{flex-shrink:0; position:absolute; bottom:0; left:0; width:100%;
    display:flex; justify-content:space-around; background:rgba(255,255,255,.92);
    backdrop-filter:saturate(160%) blur(14px); -webkit-backdrop-filter:saturate(160%) blur(14px);
    border-top:1px solid var(--border); padding:8px 8px calc(8px + var(--sab));}
  nav button{border:0; background:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:6px 14px; border-radius:14px; color:#9a978f; font-size:11px; font-weight:700; transition:all .2s;}
  nav button svg{width:24px; height:24px;}
  nav button.on{color:var(--primary); background:var(--primary-l);}

  /* ---------- history / misc ---------- */
  .hist{padding:14px 16px;} .hist + .hist{border-top:1px solid var(--border);}
  .hist .meta{color:var(--sub); font-size:12px; margin-bottom:5px;}
  .hist pre{white-space:pre-wrap; font-family:inherit; margin:0; font-size:14px; line-height:1.5;}
  .link{color:var(--primary); font-weight:700; cursor:pointer;}
  .empty{color:var(--sub); text-align:center; padding:26px 10px; font-size:14px;}
  .del{color:var(--error); font-size:13px; font-weight:700; background:none; border:0; cursor:pointer;}
  .addrow{display:flex; gap:8px; margin-top:10px;}
  .addrow .input{flex:1;}
  .addrow button{border:0; background:var(--primary); color:#fff; font-weight:800; border-radius:var(--r-md); padding:0 18px; cursor:pointer;}

  /* ---------- modal ---------- */
  .modal{position:fixed; inset:0; background:rgba(20,20,18,.42); display:none; align-items:flex-end; justify-content:center; z-index:60;}
  .modal.on{display:flex; animation:fade .2s;}
  .modal .box{background:var(--card); border-radius:24px 24px 0 0; padding:24px 20px calc(24px + var(--sab)); width:100%; max-width:540px; animation:sheet .28s cubic-bezier(.2,.8,.3,1);}
  @keyframes sheet{from{transform:translateY(100%)} to{transform:none}}
  .modal h3{margin:0 0 16px; font-size:19px; font-weight:800;}

  .toast{position:fixed; bottom:calc(96px + var(--sab)); left:50%; transform:translateX(-50%); background:#2a2a28; color:#fff; padding:12px 20px; border-radius:var(--r-pill); font-size:14px; font-weight:600; opacity:0; transition:opacity .2s; z-index:80; pointer-events:none;}
  .toast.on{opacity:.96;}
  .mt{margin-top:22px;}
</style>
</head>
<body>
<div id="app">
  <header id="hdr"></header>
  <main id="main"></main>
  <nav id="tabbar"></nav>
</div>
<div class="modal" id="modal"><div class="box" id="modalbox"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
 * 締めアプリ Phase1 — Premium redesign（Apple×Linear方向）
 * 素JS + 共通コンポーネント + テーマ変数。localStorage保存（将来Firestore共有）。
 * データ入出力は store.* に集約。
 * ============================================================ */
var STORES = { kaki:{id:"kaki",name:"柿川亭",icon:"store"}, abura:{id:"abura",name:"アブララボ",icon:"flask"} };
var CHANNELS = { sms:"SMS", email:"メール", line:"LINE", messenger:"Messenger" };
var LS = { suppliers:"shime_suppliers_v2", shopping:"shime_shopping", orders:"shime_orders", name:"shime_name", store:"shime_store" };
var uid = function(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); };

/* ---------- SVG icons (SF-symbol風) ---------- */
var IC = {
  store:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5 5.5 4h13L20 9.5"/><path d="M4 9.5v10.5h16V9.5"/><path d="M4 9.5a2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 5 0"/><path d="M9 20v-5h6v5"/></svg>',
  flask:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3"/><path d="M7.5 14h9"/></svg>',
  download:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 4 5-4"/><path d="M5 20h14"/></svg>',
  check:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 6"/></svg>',
  clipboard:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2.5"/><path d="M9 4a3 3 0 0 1 6 0"/><path d="M9 11h6M9 15h4"/></svg>',
  send:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3 11 14"/><path d="M22 3 15 21l-4-7-7-4 18-7z"/></svg>',
  bag:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>',
  cart:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.2 11.2A2 2 0 0 0 9.2 17h8a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>',
  chev:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
  back:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>',
  copy:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
  plus:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
};
function ic(n){ return IC[n]||""; }

/* ---------- data ---------- */
var store = {
  get:function(k,d){ try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;} },
  set:function(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} },
  suppliers:function(){ return store.get(LS.suppliers,null)||seed(); },
  saveSuppliers:function(a){ store.set(LS.suppliers,a); },
  orders:function(){ return store.get(LS.orders,[]); },
  saveOrders:function(a){ store.set(LS.orders,a); },
  shopping:function(){ return store.get(LS.shopping,[]); },
  saveShopping:function(a){ store.set(LS.shopping,a); }
};
function it(name,unit,stores){ return {id:uid(),name:name,unit:unit||"",stores:stores||["kaki","abura"]}; }
function itemStores(item){ return (item.stores&&item.stores.length)?item.stores:["kaki","abura"]; }
function itemForStore(item,st){ return itemStores(item).indexOf(st)>=0; }
function seed(){
  var s=[
    {id:uid(),name:"めんつう",channel:"sms",contact:"",category:"ラーメン麺",av:{t:"め",bg:"#243a6b"},order:1,
      items:[it("太麺","玉"),it("細麺","玉"),it("冷凍12番150g","パック"),it("冷凍16番太麺","玉")]},
    {id:uid(),name:"ホクショク",channel:"sms",contact:"",category:"食材・調味料",av:{t:"ホ",bg:"#7a2230"},order:2,
      items:[it("豚骨のタレ","本"),it("柿川亭のタレ","ケース",["kaki"]),it("メンマ","ケース"),it("にんにく","個")]},
    {id:uid(),name:"中越鶏卵",channel:"email",contact:"",category:"卵・鶏肉",av:{t:"🥚",bg:"#efe3bf"},order:3,
      items:[it("卵","パック")]},
    {id:uid(),name:"竹内農園",channel:"line",contact:"",category:"野菜・青果",av:{t:"🌿",bg:"#d7ebcf"},order:4,items:[]},
    {id:uid(),name:"マルヤマ包装",channel:"line",contact:"",category:"容器・包装資材",av:{t:"📦",bg:"#e4d6bd"},order:5,items:[]},
    {id:uid(),name:"アルベーロ",channel:"messenger",contact:"",category:"備品・雑貨",av:{t:"💬",bg:"linear-gradient(135deg,#8a5cf6,#e0559b)"},order:6,items:[]}
  ];
  store.saveSuppliers(s); return s;
}

/* ---------- state ---------- */
var STATE = { tab:"order", detail:null }; // detail:{view:'order'|'master', sid}
var CUR = store.get(LS.store,"kaki");
var MYNAME = store.get(LS.name,"");
var draft = {}; // sid -> {deliver, qty:{}, split:{}, text}

/* ---------- helpers ---------- */
function el(id){return document.getElementById(id);}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function toast(m){var t=el("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("on");},1600);}
function storeName(){return STORES[CUR].name;}
function otherName(){return CUR==="kaki"?STORES.abura.name:STORES.kaki.name;}
function todayPlus(n){var d=new Date();d.setDate(d.getDate()+n);return d;}
var WD=["日","月","火","水","木","金","土"];
function deliverInfo(k){if(k==="today")return{rel:"本日",d:todayPlus(0)};if(k==="day2")return{rel:"明後日",d:todayPlus(2)};return{rel:"明日",d:todayPlus(1)};}
function dayKey(o){var d=todayPlus(o||0);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function fmtTime(ts){var d=new Date(ts);return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);}
function findSup(sid){var a=store.suppliers();for(var i=0;i<a.length;i++)if(a[i].id===sid)return a[i];return null;}
function byOrder(a,b){return (a.order||0)-(b.order||0);}

/* ---------- order text ---------- */
function buildText(sup){
  var d=draft[sup.id]||{}; var di=deliverInfo(d.deliver||"tomorrow");
  var L=["お世話になっております。", di.rel+WD[di.d.getDay()]+"曜日", storeName()];
  (sup.items||[]).forEach(function(item){
    if(!itemForStore(item,CUR)) return;
    var q=(d.qty&&d.qty[item.id])||0;
    if(q>0){ L.push(item.name+q+(item.unit||"")); }
  });
  L.push("お願いいたします🙇");
  return L.join("\n");
}
function currentText(sid){var d=draft[sid]||{};var sup=findSup(sid);return d.text!=null?d.text:buildText(sup);}
function hasQty(sid){var d=draft[sid];if(!d||!d.qty)return false;for(var k in d.qty)if(d.qty[k]>0)return true;return false;}
function sentToday(sid){return store.orders().some(function(o){return o.store===CUR&&o.supplierId===sid&&o.dateKey===dayKey(0)&&o.status==="sent";});}
function statusOf(sup){
  if(sentToday(sup.id)) return {k:"sent",cls:"st-sent",t:"送信済み"};
  if(hasQty(sup.id)) return sup.contact||sup.channel==="line"||sup.channel==="messenger" ? {k:"ready",cls:"st-ready",t:"送信準備OK"} : {k:"input",cls:"st-input",t:"入力済"};
  return {k:"none",cls:"st-none",t:"未送信"};
}

/* ---------- send links ---------- */
function sendLink(sup,text){
  var enc=encodeURIComponent(text);
  if(sup.channel==="sms"){var n=(sup.contact||"").replace(/[^0-9+]/g,"");return{href:n?("sms:"+n+"?&body="+enc):null,label:"SMSを開いて送信",need:"携帯番号"};}
  if(sup.channel==="email"){var to=sup.contact||"";return{href:to?("mailto:"+to+"?subject="+encodeURIComponent("発注（"+storeName()+"）")+"&body="+enc):null,label:"メールを開いて送信",need:"メールアドレス"};}
  if(sup.channel==="line")return{href:"line://msg/text/"+enc,label:"LINEを開く（本文入り）",need:null};
  return{href:"fb-messenger://",label:"Messengerを開く",need:null};
}

/* ============================================================
 * components
 * ============================================================ */
function C_pill(text,cls){return '<span class="pill '+cls+'">'+esc(text)+'</span>';}
function C_status(st){return '<span class="status '+st.cls+'">'+esc(st.t)+'</span>';}
function C_avatar(sup){var av=sup.av||{};
  if(av.img) return '<div class="avatar" style="background-image:url('+av.img+');background-size:cover;background-position:center"></div>';
  var bg=av.bg||"#888";var t=av.t||sup.name.slice(0,1);
  return '<div class="avatar" style="background:'+bg+'">'+esc(t)+'</div>';}
function C_sec(icon,title){return '<div class="sec"><div class="sicon">'+ic(icon)+'</div><h2>'+esc(title)+'</h2></div>';}
function C_supcard(sup,onclick,extra){
  return '<div class="card tap" onclick="'+onclick+'"><div class="suprow">'+C_avatar(sup)
    +'<div class="supmid"><div class="supname">'+esc(sup.name)+' '+C_pill(CHANNELS[sup.channel],"ch-"+sup.channel)+'</div>'
    +'<div class="supcat">'+esc(sup.category||"")+'</div></div>'
    +'<div class="supright">'+(extra||"")+'<span class="chev">'+ic("chev")+'</span></div></div></div>';
}

/* ============================================================
 * render
 * ============================================================ */
function render(){
  renderHeader(); renderTabbar();
  var m=el("main"); var slide = STATE.detail? " slide":"";
  m.innerHTML='<div class="screen'+slide+'">'+ (STATE.detail? detailScreen() : tabScreen()) +'</div>';
  m.scrollTop=0;
}
function renderHeader(){
  var h=el("hdr");
  if(STATE.detail){
    var sup=findSup(STATE.detail.sid);
    h.innerHTML='<div class="htop"><button class="hback" onclick="closeDetail()">'+ic("back")+'戻る</button>'
      +'<div class="hname" onclick="askName()">担当: '+esc(MYNAME||"未設定")+'</div></div>';
  } else {
    h.innerHTML='<div class="htop"><div class="htitle">締めアプリ</div><div class="hname" onclick="askName()">担当: '+esc(MYNAME||"未設定")+'</div></div>'
      +'<div class="stabs">'
      +'<div class="stab '+(CUR==="kaki"?"on":"")+'" onclick="setStore(\'kaki\')">'+ic("store")+'柿川亭</div>'
      +'<div class="stab '+(CUR==="abura"?"on":"")+'" onclick="setStore(\'abura\')">'+ic("flask")+'アブララボ</div>'
      +'</div>';
  }
}
function renderTabbar(){
  var tabs=[["shime","締め","clipboard"],["order","発注","send"],["shop","買い出し","cart"],["master","マスタ","bag"]];
  el("tabbar").innerHTML=tabs.map(function(t){
    return '<button class="'+(STATE.tab===t[0]&&!STATE.detail?"on":"")+'" onclick="go(\''+t[0]+'\')">'+ic(t[2])+'<span>'+t[1]+'</span></button>';
  }).join("");
}
function go(t){STATE.tab=t;STATE.detail=null;render();}
function setStore(s){CUR=s;store.set(LS.store,s);render();}
function openDetail(view,sid){STATE.detail={view:view,sid:sid};render();}
function closeDetail(){STATE.detail=null;render();}

function tabScreen(){
  if(STATE.tab==="shime")return viewShime();
  if(STATE.tab==="order")return viewOrder();
  if(STATE.tab==="master")return viewMaster();
  return viewShop();
}
function detailScreen(){
  return STATE.detail.view==="order"? orderDetail(STATE.detail.sid) : masterDetail(STATE.detail.sid);
}

/* ---------- 締め dashboard ---------- */

  var steps=[["1","券売機集計",true],["2","anydeli集計",true],["3","客数確認",true],["4","仕入記録",true]];
  var rows=steps.map(function(s){return '<div class="steprow soon"><div class="stl"><span class="stnum">'+s[0]+'</span>'+s[1]+'</div>'+C_pill("近日","ch-messenger").replace("ch-messenger","st-none")+'</div>';}).join("");

    +'<a class="btn primary big mt" onclick="go(\'order\')" style="cursor:pointer"><span>'+ic("send")+'</span><span class="lbl"><span>発注をすすめる</span></span><span class="chevend">'+ic("chev")+'</span></a>'

/* ---------- 発注 detail ---------- */

  var st=statusOf(sup);
  var head='<div class="card"><div class="suprow">'+C_avatar(sup)+'<div class="supmid"><div class="supname">'+esc(sup.name)+' '+C_pill(CHANNELS[sup.channel],"ch-"+sup.channel)+'</div><div class="supcat">'+esc(sup.category||"")+'</div></div>'+C_status(st)+'</div></div>';
  d.deliver="tomorrow";
  var _di=deliverInfo("tomorrow");
  var seg='<div class="card cardpad" style="padding:14px 16px;display:flex;align-items:center;justify-content:space-between"><span class="lbl-mini" style="margin:0">お届け日</span>'
    +'<span style="font-size:16px;font-weight:700">明日 '+(_di.d.getMonth()+1)+'/'+_di.d.getDate()+'（'+WD[_di.d.getDay()]+'）</span></div>';
  var shownItems=(sup.items||[]).filter(function(item){return itemForStore(item,CUR);});
  var items = shownItems.length ? '<div class="card cardpad"><label class="lbl-mini">数量（'+esc(storeName())+'）</label><div class="items">'+shownItems.map(function(item){
      var q=d.qty[item.id]||0;
      return '<div class="irow"><div class="iname">'+esc(item.name)+'<span class="iunit">'+esc(item.unit||"")+'</span></div>'
        +'<div class="stepper"><button onclick="qty(\''+sid+'\',\''+item.id+'\',-1)">−</button><span class="qv'+(q>0?' hot':'')+'" id="q_'+sid+'_'+item.id+'">'+q+'</span><button onclick="qty(\''+sid+'\',\''+item.id+'\',1)">＋</button></div></div>';
    }).join("")+'</div></div>'
    : '<div class="card cardpad empty">'+esc(storeName())+'向けの品目が未登録です。<span class="link" onclick="openDetail(\'master\',\''+sid+'\')">マスタで追加</span></div>';

    : '<div class="btn disabled">'+link.label+'（マスタで'+link.need+'を登録）</div>';

    +'<textarea class="input" id="msg_'+sid+'" oninput="editText(\''+sid+'\',this.value)">'+esc(text)+'</textarea></div>';

    +'<div class="btnrow"><button class="btn sec" onclick="copyText(\''+sid+'\')"><span>'+ic("copy")+'</span>本文コピー</button>'
    +'<button class="btn ok" onclick="markSent(\''+sid+'\')"><span>'+ic("check")+'</span>送信した</button></div>';

function segBtn(sid,k,label){var d=draft[sid];var on=(d&&d.deliver||"tomorrow")===k;return '<button class="'+(on?"on":"")+'" onclick="setDeliver(\''+sid+'\',\''+k+'\')">'+label+'</button>';}

var SWATCHES=["#243a6b","#7a2230","#2f6f5e","#c8632b","#b26a1c","#6a3fd0","#2a8f4e","#555555","#efe3bf","#d7ebcf","#e4d6bd","#e9d5ec"];
var editAv=null, editAvSid=null;
function ensureEditAv(sid){ if(editAvSid!==sid){ var s=findSup(sid); editAv=Object.assign({t:"",bg:"#888888",img:""}, s.av||{}); editAvSid=sid; } }
function avRefresh(sid){ var p=el("av_prev"); if(p) p.innerHTML=C_avatar({name:findSup(sid).name, av:editAv}); }
function avGlyph(sid,v){ ensureEditAv(sid); editAv.t=v; editAv.img=""; avRefresh(sid); }
function avColor(sid,hex){ ensureEditAv(sid); editAv.bg=hex; editAv.img=""; var i=el("m_av_bg"); if(i)i.value=hex; avRefresh(sid); }
function avClearImg(sid){ ensureEditAv(sid); editAv.img=""; avRefresh(sid); toast("画像を消しました"); }
function avImg(sid,input){ ensureEditAv(sid); var f=input.files&&input.files[0]; if(!f) return;
  var r=new FileReader(); r.onload=function(e){ var img=new Image(); img.onload=function(){ var sz=160; var c=document.createElement("canvas"); c.width=sz; c.height=sz; var ctx=c.getContext("2d");
    var m=Math.min(img.width,img.height); ctx.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,sz,sz);
    editAv.img=c.toDataURL("image/jpeg",0.82); avRefresh(sid); toast("画像を設定しました"); }; img.src=e.target.result; };
  r.readAsDataURL(f); }
function masterDetail(sid){

    +'<input type="hidden" id="m_av_bg" value="'+esc(editAv.bg||"")+'">'
    +'<div class="btnrow"><label class="btn sec" style="cursor:pointer"><span>'+ic("plus")+'</span>写真を選ぶ<input type="file" accept="image/*" style="display:none" onchange="avImg(\''+sid+'\',this)"></label>'
    +'<button class="btn ghost" onclick="avClearImg(\''+sid+'\')">写真を消す</button></div>'
    +'</div>';
  var form='<div class="card cardpad">'
    +'<div class="field"><label>業者名</label><input class="input" id="m_name" value="'+esc(s.name)+'"></div>'
    +'<div class="field"><label>カテゴリ</label><input class="input" id="m_cat" value="'+esc(s.category||"")+'"></div>'
    +'<div class="field"><label>連絡ツール</label><select class="input" id="m_ch">'+Object.keys(CHANNELS).map(function(c){return '<option value="'+c+'" '+(c===s.channel?"selected":"")+'>'+CHANNELS[c]+'</option>';}).join("")+'</select></div>'
    +'<div class="field"><label>'+cl+'</label><input class="input" id="m_contact" value="'+esc(s.contact||"")+'"></div>'
    +avblock
    +'<button class="btn primary" onclick="saveSupplier(\''+sid+'\')"><span>'+ic("check")+'</span>保存</button>'
    +'</div>';
  var items='<div class="card cardpad"><label class="lbl-mini">定番品目（店舗ごとに設定可）</label><div class="items">'
    +((s.items||[]).length?(s.items||[]).map(function(item){
      return '<div class="irow"><div class="iname">'+esc(item.name)+'<span class="iunit">'+esc(item.unit||"")+'</span> '
        +'<span onclick="cycleItemStore(\''+sid+'\',\''+item.id+'\')" style="cursor:pointer">'+storeTag(item)+'</span></div>'
        +'<button class="del" onclick="delItem(\''+sid+'\',\''+item.id+'\')">削除</button></div>';

    +'</div>'

}

/* ---------- history ---------- */
function histCard(n){
  var os=store.orders().slice().sort(function(a,b){return b.ts-a.ts;}).slice(0,n);
  if(!os.length)return '<div class="card empty">まだありません</div>';
  return '<div class="card">'+os.map(function(o){var d=new Date(o.ts);
    return '<div class="hist"><div class="meta">'+(d.getMonth()+1)+'/'+d.getDate()+' '+fmtTime(o.ts)+' ・ '+esc(o.supplierName)+' → '+esc(STORES[o.store]?STORES[o.store].name:o.store)+' ・ '+esc(o.by||"")+' <span class="link" onclick="reuse(\''+o.id+'\')">同じ内容で作る</span></div><pre>'+esc(o.text)+'</pre></div>';
  }).join("")+'</div>';
}

/* ============================================================
 * actions
 * ============================================================ */
function setDeliver(sid,k){draft[sid]=draft[sid]||{qty:{},split:{}};draft[sid].deliver=k;draft[sid].text=null;render();}
function qty(sid,iid,delta){draft[sid]=draft[sid]||{deliver:"tomorrow",qty:{},split:{}};var v=(draft[sid].qty[iid]||0)+delta;if(v<0)v=0;draft[sid].qty[iid]=v;draft[sid].text=null;
  var qv=el("q_"+sid+"_"+iid);if(qv){qv.textContent=v;qv.classList.toggle("hot",v>0);}var ta=el("msg_"+sid);if(ta)ta.value=buildText(findSup(sid));}
function toggleSplit(sid,iid){draft[sid]=draft[sid]||{deliver:"tomorrow",qty:{},split:{}};var sr=el("sr_"+sid+"_"+iid);
  if(draft[sid].split[iid]==null){draft[sid].split[iid]=0;if(sr)sr.classList.add("on");}else{delete draft[sid].split[iid];if(sr)sr.classList.remove("on");}
  draft[sid].text=null;var ta=el("msg_"+sid);if(ta)ta.value=buildText(findSup(sid));}
function setSplit(sid,iid,v){draft[sid].split[iid]=Math.max(0,parseInt(v,10)||0);draft[sid].text=null;var ta=el("msg_"+sid);if(ta)ta.value=buildText(findSup(sid));}
function editText(sid,v){draft[sid]=draft[sid]||{qty:{},split:{}};draft[sid].text=v;}
function markOpened(sid){setTimeout(function(){saveOrder(sid,"opened");},300);}
function markSent(sid){saveOrder(sid,"sent");toast("送信を記録しました");closeDetail();}
function saveOrder(sid,status){var sup=findSup(sid);if(!sup)return;var os=store.orders();
  os.push({id:uid(),ts:Date.now(),dateKey:dayKey(0),store:CUR,supplierId:sid,supplierName:sup.name,channel:sup.channel,text:currentText(sid),by:MYNAME,status:status});store.saveOrders(os);}
function copyText(sid){var t=currentText(sid);if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){toast("本文をコピーしました");},function(){fbCopy(t);});else fbCopy(t);saveOrder(sid,"opened");}
function fbCopy(t){var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("本文をコピーしました");}catch(e){}document.body.removeChild(ta);}
function reuse(oid){var o=store.orders().filter(function(x){return x.id===oid;})[0];if(!o)return;draft[o.supplierId]={deliver:"tomorrow",qty:{},split:{},text:o.text};openDetail("order",o.supplierId);}
function bulkSend(){var sups=store.suppliers().sort(byOrder);var first=sups.filter(function(s){return statusOf(s).k==="ready";})[0]||sups.filter(function(s){return hasQty(s.id)&&!sentToday(s.id);})[0];
  if(!first){toast("先に数量を入力してください");return;}openDetail("order",first.id);}

/* master */
function storeTag(item){var st=itemStores(item);if(st.length>=2)return C_pill("両方","ch-line");return C_pill(STORES[st[0]]?STORES[st[0]].name:st[0],"ch-sms");}
function addItem(sid){var nm=el("ain_"+sid).value.trim();if(!nm)return;var unit=el("au_"+sid).value.trim();var sc=el("asc_"+sid)?el("asc_"+sid).value:"both";
  var stores=sc==="both"?["kaki","abura"]:[sc];
  var a=store.suppliers();var s=a.filter(function(x){return x.id===sid;})[0];s.items=s.items||[];s.items.push(it(nm,unit,stores));store.saveSuppliers(a);render();}
function cycleItemStore(sid,iid){var a=store.suppliers();var s=a.filter(function(x){return x.id===sid;})[0];var item=(s.items||[]).filter(function(i){return i.id===iid;})[0];if(!item)return;
  var cur=itemStores(item).slice().sort().join(",");
  item.stores = cur==="abura,kaki" ? ["kaki"] : (cur==="kaki" ? ["abura"] : ["kaki","abura"]);
  store.saveSuppliers(a);render();}
function delItem(sid,iid){var a=store.suppliers();var s=a.filter(function(x){return x.id===sid;})[0];s.items=(s.items||[]).filter(function(i){return i.id!==iid;});store.saveSuppliers(a);render();}
function saveSupplier(sid){var a=store.suppliers();var s=a.filter(function(x){return x.id===sid;})[0];
  s.name=el("m_name").value.trim()||s.name;s.category=el("m_cat").value.trim();s.channel=el("m_ch").value;s.contact=el("m_contact").value.trim();
  ensureEditAv(sid); if(el("m_av_t")) editAv.t=el("m_av_t").value.trim();
  var av={t:editAv.t||"",bg:editAv.bg||"#888888",img:editAv.img||""}; if(!av.img&&!av.t) av.t=s.name.slice(0,1); s.av=av;
  store.saveSuppliers(a);toast("保存しました");render();}
function delSupplier(sid){if(!confirm("この業者を削除しますか？"))return;store.saveSuppliers(store.suppliers().filter(function(x){return x.id!==sid;}));closeDetail();}
function addSupplier(){var a=store.suppliers();a.push({id:uid(),name:"新しい業者",channel:"sms",contact:"",category:"",av:{t:"新",bg:"#8a8a80"},order:a.length+1,items:[]});store.saveSuppliers(a);var nw=a[a.length-1];openDetail("master",nw.id);}

/* shopping */
function addShop(common){var i=el("shopin");var v=i.value.trim();if(!v){toast("品名を入力");return;}var u=el("shopunit")?el("shopunit").value.trim():"";var a=store.shopping();a.push({id:uid(),text:v,unit:u,qty:1,store:common?"common":CUR,done:false,by:MYNAME,ts:Date.now()});store.saveShopping(a);i.value="";if(el("shopunit"))el("shopunit").value="";render();}
function shopQty(id,d){var a=store.shopping();a.forEach(function(x){if(x.id===id){x.qty=Math.max(0,(x.qty||1)+d);}});store.saveShopping(a);render();}
function toggleShop(id){var a=store.shopping();a.forEach(function(x){if(x.id===id){x.done=!x.done;x.doneBy=x.done?MYNAME:"";}});store.saveShopping(a);render();}
function delShop(id){store.saveShopping(store.shopping().filter(function(x){return x.id!==id;}));render();}
function clearDoneShop(){store.saveShopping(store.shopping().filter(function(x){return !x.done;}));render();}

/* name / modal */
function askName(){openModal('<h3>お名前（担当者）</h3><div class="field"><input class="input" id="nm_in" placeholder="例：田中" value="'+esc(MYNAME)+'"></div><button class="btn primary" onclick="saveName()"><span>'+ic("check")+'</span>保存</button><button class="btn ghost" style="margin-top:6px" onclick="closeModal()">閉じる</button>');}
function saveName(){MYNAME=el("nm_in").value.trim();store.set(LS.name,MYNAME);closeModal();render();}
function openModal(h){el("modalbox").innerHTML=h;el("modal").classList.add("on");}
function closeModal(){el("modal").classList.remove("on");}
el("modal").addEventListener("click",function(e){if(e.target===this)closeModal();});

/* init */
store.suppliers();
if(!MYNAME)setTimeout(askName,500);
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
</body>
</html>
